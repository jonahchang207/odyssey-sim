    <line x1="178" y1="310" x2="334" y2="310" stroke="#caa04a" stroke-width="2.5" opacity="0.8"/>
    <circle cx="222" cy="328" r="9" fill="#f7ecd2" stroke="#8a6420" stroke-width="3.5"/>
    <circle cx="256" cy="330" r="9" fill="#f7ecd2" stroke="#8a6420" stroke-width="3.5"/>
