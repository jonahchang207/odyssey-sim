    <linearGradient id="bbrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b54e"/>
      <stop offset="0.5" stop-color="#c9972c"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="bcopper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d28a4d"/>
      <stop offset="0.55" stop-color="#b87333"/>
      <stop offset="1" stop-color="#7e4a1d"/>
    </linearGradient>
    <linearGradient id="bwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5530"/>
      <stop offset="1" stop-color="#3c2a16"/>
    </linearGradient>
    <radialGradient id="bsky" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#33281c"/>
      <stop offset="1" stop-color="#1f1710"/>
    </radialGradient>
    <linearGradient id="btext2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecc676"/>
      <stop offset="0.55" stop-color="#c9972c"/>
      <stop offset="1" stop-color="#96701f"/>
    </linearGradient>
    <g id="btooth">
      <rect x="242" y="4" width="28" height="38" rx="6" fill="url(#bbrass)" stroke="#6b4e1d" stroke-width="3"/>
    </g>
  </defs>

