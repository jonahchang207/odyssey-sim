    <use href="#btooth" transform="rotate(120 256 256)"/>
    <use href="#btooth" transform="rotate(150 256 256)"/>
    <use href="#btooth" transform="rotate(180 256 256)"/>
    <use href="#btooth" transform="rotate(210 256 256)"/>
    <use href="#btooth" transform="rotate(240 256 256)"/>
    <use href="#btooth" transform="rotate(270 256 256)"/>
    <use href="#btooth" transform="rotate(300 256 256)"/>
    <use href="#btooth" transform="rotate(330 256 256)"/>
    <circle cx="256" cy="256" r="234" fill="url(#bbrass)" stroke="#6b4e1d" stroke-width="4"/>
    <circle cx="256" cy="256" r="200" fill="url(#bsky)" stroke="#5a3c14" stroke-width="4"/>
    <circle cx="256" cy="256" r="190" fill="none" stroke="#caa04a" stroke-width="2" stroke-dasharray="3 9" opacity="0.7"/>
    <circle cx="142" cy="118" r="2.5" fill="#f1e3c5" opacity="0.8"/>
    <circle cx="362" cy="104" r="2" fill="#f1e3c5" opacity="0.6"/>
